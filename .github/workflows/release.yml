name: Build Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Download LuaJ
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force libs | Out-Null

          Invoke-WebRequest `
            -Uri "https://repo.maven.apache.org/maven2/org/luaj/luaj-jme/3.0.1/luaj-jme-3.0.1.jar" `
            -OutFile "libs/luaj-jme-3.0.1.jar"
      - name: Compile game
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force libs | Out-Null
          New-Item -ItemType Directory -Force out/artifacts/tower_defense_jar | Out-Null
          New-Item -ItemType Directory -Force out/classes | Out-Null

          Invoke-WebRequest `
            -Uri "https://repo.maven.apache.org/maven2/org/luaj/luaj-jme/3.0.1/luaj-jme-3.0.1.jar" `
            -OutFile "libs/luaj-jme-3.0.1.jar"

          Get-ChildItem -Recurse src -Filter *.java |
            ForEach-Object { $_.FullName } |
            Set-Content sources.txt

          javac -cp "libs/luaj-jme-3.0.1.jar" -d out/classes -encoding UTF-8 "@sources.txt"

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Put resources in JAR input
        shell: pwsh
        run: |
          Copy-Item -Path "resources/*" -Destination "out/classes" -Recurse -Force

          if (-not (Test-Path "out/classes/sprites/map/foliage/grass.png")) {
            throw "Verwachte sprite ontbreekt in de build-output."
          }

      - name: Create tower-defense.jar with LuaJ
        shell: pwsh
        run: |
          $artifacts = "out/artifacts/tower_defense_jar"
          $luaJar = (Resolve-Path "libs/luaj-jme-3.0.1.jar").Path

          Push-Location "out/classes"
          try {
            jar --extract --file "$luaJar"

            if ($LASTEXITCODE -ne 0) {
              throw "Uitpakken van LuaJ is mislukt."
            }

            Remove-Item "META-INF/MANIFEST.MF" -ErrorAction SilentlyContinue
          }
          finally {
            Pop-Location
          }

          if (-not (Test-Path "out/classes/org/luaj/vm2/Globals.class")) {
            throw "LuaJ ontbreekt in de build-output."
          }

          jar --create `
            --file "$artifacts/tower-defense.jar" `
            --main-class towerdefence.Main `
            -C out/classes .

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Build TowerDefense.exe with jpackage
        shell: pwsh
        run: |
          $projectRoot = $PWD.Path
          $artifacts = "$projectRoot/out/artifacts/tower_defense_jar"

          Remove-Item -Recurse -Force "$artifacts/TowerDefense" -ErrorAction SilentlyContinue

          jpackage `
            --input $artifacts `
            --name TowerDefense `
            --main-jar tower-defense.jar `
            --main-class towerdefence.Main `
            --type app-image `
            --dest $artifacts

          Copy-Item -Recurse -Force "$projectRoot/config" "$artifacts/TowerDefense/config"

      - name: Zip only the game
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "out/artifacts/tower_defense_jar/TowerDefense" `
            -DestinationPath "TowerDefense-windows.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: TowerDefense-windows.zip
          generate_release_notes: true